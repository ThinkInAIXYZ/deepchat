[package]
name = "deepchat-dim-host"
version = "0.23.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
aimux-core = { path = "../dim-source/vendor/aimux/aimux-core" }
aimux-providers = { path = "../dim-source/vendor/aimux/aimux-providers", default-features = false }
aimux-provider-utils = { path = "../dim-source/vendor/aimux/aimux-provider-utils" }
dim-agent-aimux = { path = "../dim-source/crates/dim-agent-aimux" }
dim-app-server = { path = "../dim-source/crates/dim-app-server" }
dim-agent-runtime = { path = "../dim-source/crates/dim-agent-runtime" }
dim-agent-types = { path = "../dim-source/crates/dim-agent-types" }
dim-agent-capabilities = { path = "../dim-source/crates/dim-agent-capabilities" }
dim-session-title = { path = "../dim-source/crates/dim-session-title" }
dim-agent-scheduler = { path = "../dim-source/crates/dim-agent-scheduler" }
dim-goal = { path = "../dim-source/crates/dim-goal" }
dim-modality = { path = "../dim-source/crates/dim-modality" }
dim-modality-aimux = { path = "../dim-source/crates/dim-modality-aimux" }
dim-ocr = { path = "../dim-source/crates/dim-ocr" }
futures-util = "0.3"
rutis = "=0.19.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
tokio = { version = "1.53.3", features = ["net", "io-util", "time"] }
tokio-util = "0.7.19"
uuid = { version = "=1.29.2", features = ["v4"] }

[profile.dev]
debug = 0
