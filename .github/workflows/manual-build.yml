name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择要构建的平台'
        required: true
        type: choice
        options:
          - 'all'
          - 'macos'
          - 'windows'
          - 'linux'
      arch:
        description: '选择架构'
        required: true
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
  push:
    tags:
      - 'miowork-v*'

permissions:
  contents: write

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64", "arm64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pnpm workspace for macOS
        run: pnpm run install:sharp
        env:
          TARGET_OS: darwin
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Reinstall target dependencies
        run: pnpm install --frozen-lockfile

      - name: Install macOS runtimes
        run: pnpm run installRuntime:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || github.token }}

      - name: Install DuckDB VSS
        run: pnpm run installRuntime:duckdb:vss -- --platform darwin --arch ${{ matrix.arch }}

      - name: Build and package macOS (unsigned)
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          unset DEEPCHAT_APPLE_NOTARY_USERNAME DEEPCHAT_APPLE_NOTARY_TEAM_ID DEEPCHAT_APPLE_NOTARY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          pnpm run build
          pnpm run plugin:bundle:clean
          pnpm run plugin:bundle -- --name feishu --platform darwin --arch ${{ matrix.arch }} || echo "Feishu plugin build failed, skipping"
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish=${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GH_TOKEN: ${{ github.token }}

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: miowork-darwin-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64", "arm64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pnpm workspace for Windows
        run: pnpm run install:sharp
        env:
          TARGET_OS: win32
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Reinstall target dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Windows runtimes
        run: pnpm run installRuntime:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || github.token }}

      - name: Install DuckDB VSS
        run: pnpm run installRuntime:duckdb:vss -- --platform win32 --arch ${{ matrix.arch }}

      - name: Build and package Windows (unsigned)
        run: |
          pnpm run build
          pnpm run plugin:bundle:clean
          pnpm run plugin:bundle -- --name feishu --platform win32 --arch ${{ matrix.arch }}
          pnpm exec electron-builder --win --${{ matrix.arch }} --publish=${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GH_TOKEN: ${{ github.token }}

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: miowork-win32-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64", "arm64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pnpm workspace for Linux
        run: pnpm run install:sharp
        env:
          TARGET_OS: linux
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Reinstall target dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux runtimes
        run: pnpm run installRuntime:linux:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || github.token }}

      - name: Install DuckDB VSS
        run: pnpm run installRuntime:duckdb:vss -- --platform linux --arch ${{ matrix.arch }}

      - name: Build and package Linux
        run: |
          pnpm run build
          pnpm run plugin:bundle:clean
          pnpm run plugin:bundle -- --name feishu --platform linux --arch ${{ matrix.arch }} || echo "Feishu plugin build failed, skipping"
          pnpm exec electron-builder --linux --${{ matrix.arch }} --publish=${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GH_TOKEN: ${{ github.token }}

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: miowork-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
