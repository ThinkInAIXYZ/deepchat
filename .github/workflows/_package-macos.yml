name: Package macOS

on:
  workflow_call:
    inputs:
      source-sha:
        description: Immutable 40-character source commit.
        required: true
        type: string
      arch:
        description: Target architecture (x64 or arm64).
        required: true
        type: string
      artifact-purpose:
        description: Package intent (distribution or verification).
        required: true
        type: string
      enforce-installer-size:
        description: Compare installers with the committed package-size baseline.
        required: true
        type: boolean
    secrets:
      RTK_GITHUB_TOKEN:
        required: false
      DC_GITHUB_CLIENT_ID:
        required: false
      DC_GITHUB_CLIENT_SECRET:
        required: false
      DC_GITHUB_REDIRECT_URI:
        required: false
      DEEPCHAT_CSC_LINK:
        required: false
      DEEPCHAT_CSC_KEY_PASS:
        required: false
      DEEPCHAT_APPLE_NOTARY_USERNAME:
        required: false
      DEEPCHAT_APPLE_NOTARY_TEAM_ID:
        required: false
      DEEPCHAT_APPLE_NOTARY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  package:
    name: package-macos(${{ inputs.arch }}, ${{ inputs.artifact-purpose }})
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source-sha }}
      TARGET_PLATFORM: darwin
      TARGET_ARCH: ${{ inputs.arch }}
      PACKAGE_PURPOSE: ${{ inputs.artifact-purpose }}
      APP_DIRECTORY: ${{ inputs.arch == 'arm64' && 'dist/mac-arm64/DeepChat.app' || 'dist/mac/DeepChat.app' }}
    steps:
      - name: Validate immutable source input
        run: |
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'source-sha must be a 40-character lowercase Git SHA' >&2
            exit 1
          }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Validate package request and signing inputs
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DEEPCHAT_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DEEPCHAT_CSC_KEY_PASS }}
          DEEPCHAT_APPLE_NOTARY_USERNAME: ${{ secrets.DEEPCHAT_APPLE_NOTARY_USERNAME }}
          DEEPCHAT_APPLE_NOTARY_TEAM_ID: ${{ secrets.DEEPCHAT_APPLE_NOTARY_TEAM_ID }}
          DEEPCHAT_APPLE_NOTARY_PASSWORD: ${{ secrets.DEEPCHAT_APPLE_NOTARY_PASSWORD }}
        run: |
          node --input-type=module -e "const contract = await import('./scripts/ci/package-contract.mjs'); contract.validateSourceSha(process.env.SOURCE_SHA); contract.validateArtifactPurpose(process.env.PACKAGE_PURPOSE); contract.getTargetDefinition(process.env.TARGET_PLATFORM, process.env.TARGET_ARCH);"
          if [[ "${PACKAGE_PURPOSE}" == 'distribution' ]]; then
            missing=()
            for name in CSC_LINK CSC_KEY_PASSWORD DEEPCHAT_APPLE_NOTARY_USERNAME DEEPCHAT_APPLE_NOTARY_TEAM_ID DEEPCHAT_APPLE_NOTARY_PASSWORD; do
              [[ -n "${!name}" ]] || missing+=("${name}")
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required macOS distribution secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pnpm workspace for macOS
        run: pnpm run install:sharp
        env:
          TARGET_OS: darwin
          TARGET_ARCH: ${{ inputs.arch }}

      - name: Reinstall target dependencies
        run: pnpm install --frozen-lockfile

      - name: Report RTK install token source
        env:
          RTK_INSTALL_GITHUB_TOKEN_SOURCE: ${{ secrets.RTK_GITHUB_TOKEN != '' && 'RTK_GITHUB_TOKEN' || 'GITHUB_TOKEN' }}
        run: |
          echo "RTK runtime install token source: ${RTK_INSTALL_GITHUB_TOKEN_SOURCE}"

      - name: Verify OpenDAL native package
        run: pnpm run smoke:opendal:native -- --platform darwin --arch ${{ inputs.arch }}

      - name: Install macOS runtimes
        run: pnpm run installRuntime:mac:${{ inputs.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || github.token }}

      - name: Install and verify DuckDB VSS
        run: |
          pnpm run installRuntime:duckdb:vss -- --platform darwin --arch ${{ inputs.arch }}
          pnpm run smoke:duckdb:vss -- --platform darwin --arch ${{ inputs.arch }}

      - name: Build and package macOS
        run: |
          pnpm run build
          pnpm run plugin:bundle -- --name cua --platform darwin --arch "${TARGET_ARCH}" --purpose "${PACKAGE_PURPOSE}"
          pnpm run plugin:bundle -- --name feishu --platform darwin --arch "${TARGET_ARCH}"
          pnpm exec electron-builder --mac --"${TARGET_ARCH}" --publish=never
        env:
          CSC_LINK: ${{ secrets.DEEPCHAT_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DEEPCHAT_CSC_KEY_PASS }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.artifact-purpose == 'verification' && 'false' || '' }}
          DEEPCHAT_APPLE_NOTARY_USERNAME: ${{ secrets.DEEPCHAT_APPLE_NOTARY_USERNAME }}
          DEEPCHAT_APPLE_NOTARY_TEAM_ID: ${{ secrets.DEEPCHAT_APPLE_NOTARY_TEAM_ID }}
          DEEPCHAT_APPLE_NOTARY_PASSWORD: ${{ secrets.DEEPCHAT_APPLE_NOTARY_PASSWORD }}
          build_for_release: ${{ inputs.artifact-purpose == 'distribution' && '2' || '' }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
          VITE_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify packaged DuckDB VSS
        run: |
          extension_path="${APP_DIRECTORY}/Contents/Resources/app.asar.unpacked/runtime/duckdb/extensions/vss.duckdb_extension.b64"
          test -f "${extension_path}"
          pnpm run smoke:duckdb:vss -- --platform darwin --arch "${TARGET_ARCH}" --extension-base64-path "${extension_path}"

      - name: Verify packaged OpenDAL native package
        run: >-
          pnpm run smoke:opendal:native --
          --platform darwin
          --arch "${{ inputs.arch }}"
          --resources-path "${{ env.APP_DIRECTORY }}/Contents/Resources"

      # Verification packages are deliberately unsigned and never leave this runner as installers.
      # This keeps Apple credentials out of fork PR code while retaining native package coverage.
      - name: Verify packaged Light OCR offline
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            pnpm run smoke:light-ocr -- \
            --platform darwin \
            --arch "${TARGET_ARCH}" \
            --resources-path "${APP_DIRECTORY}/Contents/Resources" \
            --report-path "dist/light-ocr-smoke-darwin-${TARGET_ARCH}-offline.json" \
            --expect-supported \
            --require-execution

      - name: Verify packaged Light OCR performance
        run: |
          pnpm run smoke:light-ocr -- \
            --platform darwin \
            --arch "${TARGET_ARCH}" \
            --resources-path "${APP_DIRECTORY}/Contents/Resources" \
            --report-path "dist/light-ocr-smoke-darwin-${TARGET_ARCH}.json" \
            --expect-supported \
            --require-execution \
            --require-peak-rss \
            --skip-compression

      - name: Verify bundled plugins
        run: |
          plugin_root="${APP_DIRECTORY}/Contents/Resources/app.asar.unpacked/plugins"
          pnpm run plugin:verify -- --name cua --platform darwin --arch "${TARGET_ARCH}" --plugin-root "${plugin_root}"
          pnpm run plugin:verify -- --name feishu --platform darwin --arch "${TARGET_ARCH}" --plugin-root "${plugin_root}"

      - name: Compare installer sizes
        if: inputs.enforce-installer-size
        run: |
          node scripts/ci/check-package-size.mjs compare \
            --target "darwin-${TARGET_ARCH}" \
            --candidate-dir dist \
            --candidate-commit "${SOURCE_SHA}" \
            --report "dist/package-size-darwin-${TARGET_ARCH}.json"

      - name: Create package manifest and verify distribution evidence
        env:
          DEEPCHAT_APPLE_NOTARY_TEAM_ID: ${{ secrets.DEEPCHAT_APPLE_NOTARY_TEAM_ID }}
          ENFORCE_INSTALLER_SIZE: ${{ inputs.enforce-installer-size }}
        run: |
          size_report=()
          if [[ "${ENFORCE_INSTALLER_SIZE}" == 'true' ]]; then
            size_report=(--installer-size-report "dist/package-size-darwin-${TARGET_ARCH}.json")
          fi
          node scripts/ci/package-manifest.mjs \
            --platform darwin \
            --arch "${TARGET_ARCH}" \
            --source-sha "${SOURCE_SHA}" \
            --purpose "${PACKAGE_PURPOSE}" \
            --mac-app-path "${APP_DIRECTORY}" \
            --report "dist/light-ocr-smoke-darwin-${TARGET_ARCH}-offline.json" \
            --report "dist/light-ocr-smoke-darwin-${TARGET_ARCH}.json" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            "${size_report[@]}"

      - name: Upload distribution package
        if: ${{ success() && inputs.artifact-purpose == 'distribution' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deepchat-package-darwin-${{ inputs.arch }}
          path: package-output/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload verification diagnostics
        if: ${{ always() && inputs.artifact-purpose == 'verification' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deepchat-package-diagnostics-darwin-${{ inputs.arch }}
          path: |
            package-output/manifest.json
            package-output/reports/
            dist/light-ocr-smoke-darwin-${{ inputs.arch }}-offline.json
            dist/light-ocr-smoke-darwin-${{ inputs.arch }}.json
            dist/package-size-darwin-${{ inputs.arch }}.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
