name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  main-release-guard:
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate release branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${HEAD_REF}" != release/* ]]; then
            echo "PRs targeting main must come from release/<version> branches." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate release head exists on dev
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin dev --prune
          if ! git merge-base --is-ancestor "${HEAD_SHA}" origin/dev; then
            echo "Release PR head must already exist on origin/dev." >&2
            exit 1
          fi

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Check translations
        run: pnpm run i18n

      - name: Check renderer architecture baseline
        run: pnpm run architecture:renderer-baseline:check

      - name: Check generated icon collections
        run: pnpm run icons:check

      - name: Typecheck
        run: pnpm run typecheck

  test-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Test main process
        run: pnpm run test:main

  test-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Test renderer
        run: pnpm run test:renderer

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

  test-native-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Install and verify DuckDB VSS
        run: |
          pnpm run installRuntime:duckdb:vss:linux:x64
          pnpm run smoke:duckdb:vss -- --platform linux --arch x64

      - name: Validate portable memory behavior
        run: pnpm run test:memory

      - name: Prepare native SQLite for the Node ABI
        run: pnpm --dir node_modules/better-sqlite3-multiple-ciphers run install

      - name: Smoke native SQLite
        run: node scripts/smoke-memory-native-sqlite.js

      - name: Validate encrypted OCR artifact storage
        env:
          DEEPCHAT_REQUIRE_NATIVE_SQLITE: '1'
        run: pnpm exec vitest --config vitest.config.ts --run test/main/ocr/ocrArtifactStore.test.ts

      - name: Validate native memory storage
        env:
          DEEPCHAT_REQUIRE_NATIVE_SQLITE: '1'
          DEEPCHAT_REQUIRE_NATIVE_DUCKDB_VSS: '1'
        run: pnpm exec vitest --config vitest.config.memory-native.ts --run

      - name: Validate memory retrieval quality
        env:
          DEEPCHAT_REQUIRE_NATIVE_SQLITE: '1'
        run: pnpm run test:memory:eval

      - name: Validate memory performance bounds
        env:
          DEEPCHAT_REQUIRE_NATIVE_SQLITE: '1'
        run: pnpm run test:main:memory-perf

      - name: Upload memory retrieval report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: memory-retrieval-v1
          path: test-results/memory/retrieval-v1.json
          if-no-files-found: warn

  pr-required:
    if: always()
    needs:
      - main-release-guard
      - static
      - test-main
      - test-renderer
      - test-native-memory
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required PR checks
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          MAIN_RELEASE_GUARD_RESULT: ${{ needs.main-release-guard.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_MAIN_RESULT: ${{ needs.test-main.result }}
          TEST_RENDERER_RESULT: ${{ needs.test-renderer.result }}
          TEST_NATIVE_MEMORY_RESULT: ${{ needs.test-native-memory.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          failures=()

          require_success() {
            local job_name="$1"
            local result="$2"
            if [[ "${result}" != "success" ]]; then
              failures+=("${job_name}=${result}")
            fi
          }

          require_success "static" "${STATIC_RESULT}"
          require_success "test-main" "${TEST_MAIN_RESULT}"
          require_success "test-renderer" "${TEST_RENDERER_RESULT}"
          require_success "test-native-memory" "${TEST_NATIVE_MEMORY_RESULT}"
          require_success "build" "${BUILD_RESULT}"

          case "${BASE_REF}" in
            main)
              require_success "main-release-guard" "${MAIN_RELEASE_GUARD_RESULT}"
              ;;
            dev)
              if [[ "${MAIN_RELEASE_GUARD_RESULT}" != "skipped" ]]; then
                failures+=("main-release-guard=${MAIN_RELEASE_GUARD_RESULT}")
              fi
              ;;
            *)
              failures+=("unsupported-base=${BASE_REF}")
              ;;
          esac

          if (( ${#failures[@]} > 0 )); then
            printf 'Required PR checks did not pass:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "All required PR checks passed."
