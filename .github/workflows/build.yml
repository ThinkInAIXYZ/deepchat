name: Build Application

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 选择构建平台
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - mac

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  package-windows:
    name: build-windows(${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/_package-windows.yml
    with:
      source-sha: ${{ github.sha }}
      arch: ${{ matrix.arch }}
      artifact-purpose: distribution
      enforce-installer-size: false
    secrets:
      RTK_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN }}
      DC_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
      DC_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
      DC_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}

  package-linux:
    name: build-linux(${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/_package-linux.yml
    with:
      source-sha: ${{ github.sha }}
      arch: ${{ matrix.arch }}
      artifact-purpose: distribution
      enforce-installer-size: false
    secrets:
      RTK_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN }}
      DC_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
      DC_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
      DC_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}

  package-macos:
    name: build-macos(${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'mac'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/_package-macos.yml
    with:
      source-sha: ${{ github.sha }}
      arch: ${{ matrix.arch }}
      artifact-purpose: verification
      enforce-installer-size: false
    secrets:
      RTK_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN }}
      DC_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
      DC_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
      DC_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}
